name: Feature request
description: Suggest a focused improvement to the LED-to-fixture workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow problem
      description: What is difficult today, and at which step?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than only a proposed control.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Device, format, or MadMapper context
