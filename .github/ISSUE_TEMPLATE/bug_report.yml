name: Bug report
description: Report a reproducible import, workspace, repair, or export problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pixelblaze import
        - Marimapper import
        - 3D workspace
        - 2D alignment
        - Auto Repair
        - MadMapper export
        - Translation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the result you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Load …
        2. Select …
        3. Export …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and MadMapper version
      placeholder: Chrome 140, MadMapper 6.1
  - type: textarea
    id: sample
    attributes:
      label: Minimal anonymised sample
      description: Attach only data you have permission to share.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have permission to share every attached mapping file or screenshot.
          required: true
